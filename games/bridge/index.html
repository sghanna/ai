<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#163b31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bridge</title>
  <link rel="icon" href="icons/icon.svg?v=bridge-v1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=bridge-v1">
  <link rel="manifest" href="manifest.json?v=bridge-v1">
  <link rel="stylesheet" href="style.css?v=bridge-v1">
</head>
<body>
<main class="game" aria-label="Bridge game">
  <header class="header"><h1><img src="icons/icon.svg?v=bridge-v1" alt="" width="36" height="36" draggable="false">Bridge</h1><button id="menu-button" class="quiet" aria-haspopup="dialog">Menu <span aria-hidden="true">☰</span></button></header>
  <section class="scoreboard" aria-label="Match score"><div class="team us"><span>You + North<small>Session points</small></span><strong id="us-score">0</strong></div><span class="target">BOARD <b id="board-count">1 / 4</b></span><div class="team them"><strong id="them-score">0</strong><span>West + East<small>Session points</small></span></div></section>
  <div id="vulnerability" class="vulnerability"></div><div class="layout">
    <section class="arena" aria-label="Table">
      <div class="trump-rail"><div id="trump">♠ Bridge are trump</div><div id="contract">Hand 1</div></div>
      <section id="exposed-zone" class="exposed-zone" hidden><div class="hand-label"><b id="exposed-label">Dummy</b><span id="exposed-note"></span></div><div id="exposed-hand" class="hand" role="group" aria-label="Exposed hand"></div></section><div class="table" id="table">
        <div class="seat north" id="seat-2"></div><div class="seat west" id="seat-1"></div><div class="seat east" id="seat-3"></div><div class="seat south" id="seat-0"></div>
        <div id="table-center" class="table-center"></div>
      </div>
      <div class="trick-rail"><span id="tricks"></span><button id="auction-button" class="text-button" aria-haspopup="dialog">Auction</button><button id="last-trick" class="text-button" aria-haspopup="dialog" disabled>Last trick</button></div>
    </section>
    <section class="player-zone" aria-label="Your hand and actions">
      <div class="hand-label"><span id="hand-title">Your cards · South</span><span id="hand-note">Choose, then confirm</span></div>
      <div id="hand" class="hand" role="group" aria-label="Your cards"></div>
      <div class="action-panel">
        <h2 tabindex="-1" id="instruction" aria-live="polite" aria-atomic="true"></h2><p id="detail"></p>
        <div id="bid-controls" hidden>
          <div class="bid-stepper"><button id="bid-down" aria-label="Lower bid level">−</button><output id="bid-value" aria-live="polite">Level 1 · 7 tricks</output><button id="bid-up" aria-label="Raise bid level">+</button></div>
          <div id="strains" class="strains" role="group" aria-label="Choose trump or no trump"></div>
          <div class="special-calls"><button id="call-pass" aria-pressed="false">Pass</button><button id="call-double" aria-pressed="false">Double</button><button id="call-redouble" aria-pressed="false">Redouble</button></div>
        </div>
        <div id="score-detail" class="score-detail" hidden></div>

      </div>
    </section>
  </div>
  <div class="action-dock"><button id="primary-action" class="primary" disabled>Choose an action</button></div>
  <p id="practice-note" class="practice-note">Practice Bridge · You play both hands when your side declares.</p><p id="storage-note" class="storage-note" role="status"></p>
  <footer class="game-footer">A little time at the card table. <span>No ads. No account.</span></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-shell"><header class="panel-header"><h2 id="panel-title"></h2><button id="close-panel" class="quiet">Done</button></header><div id="panel-body" class="panel-body"></div></div></dialog>
<script src="deck.js?v=bridge-v1"></script><script src="engine.js?v=bridge-v1"></script><script src="touch.js?v=bridge-v1"></script><script src="app.js?v=bridge-v1"></script>
</body>
</html>
