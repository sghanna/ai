<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#163b31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Spades</title>
  <link rel="icon" href="icons/icon.svg?v=spades-v1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=spades-v1">
  <link rel="manifest" href="manifest.json?v=spades-v1">
  <link rel="stylesheet" href="style.css?v=spades-v1">
</head>
<body>
<main class="game" aria-label="Spades game">
  <header class="header"><h1><img src="icons/icon.svg?v=spades-v1" alt="" width="36" height="36" draggable="false">Spades</h1><button id="menu-button" class="quiet" aria-haspopup="dialog">Menu <span aria-hidden="true">☰</span></button></header>
  <section class="scoreboard" aria-label="Match score"><div class="team us"><span>You + Partner<small id="us-bags">0 bags</small></span><strong id="us-score">0</strong></div><span class="target">PLAY TO <b id="target-score">500</b></span><div class="team them"><strong id="them-score">0</strong><span>West + East<small id="them-bags">0 bags</small></span></div></section>
  <div class="layout">
    <section class="arena" aria-label="Table">
      <div class="trump-rail"><div id="trump">♠ Spades are trump</div><div id="contract">Hand 1</div></div>
      <div class="table" id="table">
        <div class="seat north" id="seat-2"></div><div class="seat west" id="seat-1"></div><div class="seat east" id="seat-3"></div><div class="seat south" id="seat-0"></div>
        <div id="table-center" class="table-center"></div>
      </div>
      <div class="trick-rail"><span id="tricks">Bids: us — · them —</span><button id="last-trick" class="text-button" aria-haspopup="dialog" disabled>Last trick</button></div>
    </section>
    <section class="player-zone" aria-label="Your hand and actions">
      <div class="hand-label"><span>Your cards</span><span id="hand-note">Choose, then confirm</span></div>
      <div id="hand" class="hand" role="group" aria-label="Your cards"></div>
      <div class="action-panel">
        <h2 id="instruction" aria-live="polite" aria-atomic="true"></h2><p id="detail"></p>
        <div id="bid-controls" class="bid-stepper" role="group" aria-label="Your bid" hidden><button id="bid-down" aria-label="Decrease bid">−</button><output id="bid-value" aria-live="polite">3</output><button id="bid-up" aria-label="Increase bid">+</button><button id="bid-nil" aria-pressed="false">Nil</button></div>
        <div id="score-detail" class="score-detail" hidden></div>
        <button id="primary-action" class="primary" disabled>Choose an action</button>
      </div>
    </section>
  </div>
  <p id="storage-note" class="storage-note" role="status"></p>
  <footer class="game-footer">A little time at the card table. <span>No ads. No account.</span></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-shell"><header class="panel-header"><h2 id="panel-title"></h2><button id="close-panel" class="quiet">Done</button></header><div id="panel-body" class="panel-body"></div></div></dialog>
<script src="deck.js?v=spades-v1"></script><script src="engine.js?v=spades-v1"></script><script src="touch.js?v=spades-v1"></script><script src="app.js?v=spades-v1"></script>
</body>
</html>
