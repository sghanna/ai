<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143d32"><meta name="description" content="A quiet game of classic Rummy. Readable cards, deliberate moves, saved matches and offline play."><title>Rummy · At the card table</title><link rel="manifest" href="manifest.json?v=rummy-v1"><link rel="icon" href="icons/icon.svg?v=rummy-v1" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/icon-180.png?v=rummy-v1"><link rel="stylesheet" href="style.css?v=rummy-v1"><script defer src="deck.js?v=rummy-v1"></script><script defer src="engine.js?v=rummy-v1"></script><script defer src="touch.js?v=rummy-v1"></script><script defer src="app.js?v=rummy-v1"></script></head>
<body><main class="game"><header class="header"><div class="brand"><img src="icons/icon.svg?v=rummy-v1" width="40" height="40" alt=""><div><h1>Rummy</h1><span>AT THE CARD TABLE</span></div></div><button id="menu-button" class="quiet">Menu <span aria-hidden="true">☰</span></button></header>
<section class="scoreboard" aria-label="Match score"><div><span>You</span><strong id="you-score">0</strong></div><p>FIRST TO <b id="target-score">100</b><small id="hand-number">Hand 1</small></p><div class="opponent"><span>Computer</span><strong id="computer-score">0</strong></div></section>
<div class="layout"><section class="table-zone" aria-label="Card table"><div class="opponent-rail"><span id="opponent-count">Computer · 10 cards</span><button id="last-turn" class="text-button">Last turn</button></div><div class="draw-area"><button id="stock" class="pile" aria-pressed="false"><span class="card-back" aria-hidden="true"><span>R</span></span><b>Stock</b><small id="stock-count"></small></button><div class="table-note"><span class="ornament" aria-hidden="true">♣ ♦ ♠ ♥</span><p id="table-note">Build sets.<br>Follow runs.</p></div><button id="discard" class="pile" aria-pressed="false"><span id="discard-face" class="pile-face"></span><b>Discard</b><small id="discard-label"></small></button></div><div class="meld-heading"><h2>On the table</h2><span id="meld-count">Sets & runs</span></div><div id="melds" class="melds" tabindex="0" aria-label="Sets and runs on the table"></div></section>
<section class="player-zone" aria-label="Your play area"><div class="hand-heading"><h2>Your hand <span id="hand-count"></span></h2><button id="sort" class="text-button">Sort: suit ↕</button></div><div id="hand" class="hand" aria-label="Your cards"></div><div class="action-panel"><div class="status-head"><h2 id="status">Your turn</h2><button id="hint" class="text-button">Hint</button></div><p id="detail" aria-live="polite" aria-atomic="true"></p><div id="play-actions" class="play-actions"><button id="meld-action" class="secondary">Lay set / run</button><button id="add-action" class="secondary">Add to table</button></div><button id="primary-action" class="primary">Choose a pile</button><div id="result" class="result" hidden></div><button id="clear" class="text-button" hidden>Clear selection</button></div></section></div><footer><span id="save-status">Progress saves here</span><span>Classic · 2 players · No ads</span></footer><p id="storage-note" role="status"></p></main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-header"><h2 id="panel-title">At the table</h2><button id="close-panel" class="quiet">Back to game</button></div><div id="panel-body"></div></dialog><noscript>This game needs JavaScript to deal and play cards.</noscript></body></html>
