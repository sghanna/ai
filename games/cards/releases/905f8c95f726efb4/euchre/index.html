<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#163b31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Euchre</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="/ai/games/cards/releases/905f8c95f726efb4/icons/icon-180.png">
  <link rel="manifest" href="/ai/games/cards/manifest.webmanifest">
  <link rel="stylesheet" href="/ai/games/cards/releases/905f8c95f726efb4/euchre/style.css">
<meta name="card-suite-root" content="/ai/games/cards/"><meta name="card-suite-release" content="905f8c95f726efb4"><link rel="icon" href="/ai/games/cards/releases/905f8c95f726efb4/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/ai/games/cards/releases/905f8c95f726efb4/shared/suite.css">
</head>
<body>
<main class="game" aria-label="Euchre game">
  <header class="header"><h1><img src="/ai/games/cards/releases/905f8c95f726efb4/euchre/icons/icon.svg" alt="" width="36" height="36" draggable="false">Euchre</h1><button id="menu-button" class="quiet" aria-haspopup="dialog">Menu <span aria-hidden="true">☰</span></button></header>
  <section class="scoreboard" aria-label="Match score"><div class="team us"><span>You + Partner</span><strong id="us-score">0</strong></div><span class="target">FIRST TO <b>10</b></span><div class="team them"><strong id="them-score">0</strong><span>West + East</span></div></section>
  <div class="layout">
    <section class="arena" aria-label="Table">
      <div class="trump-rail"><div id="trump">Choosing trump</div><div id="contract">Hand 1</div></div>
      <div class="table" id="table">
        <div class="seat north" id="seat-2"></div><div class="seat west" id="seat-1"></div><div class="seat east" id="seat-3"></div><div class="seat south" id="seat-0"></div>
        <div id="table-center" class="table-center"></div>
      </div>
      <div class="trick-rail"><span id="tricks">Tricks: us 0 · them 0</span><button id="last-trick" class="text-button" aria-haspopup="dialog" disabled>Last trick</button></div>
    </section>
    <section class="player-zone" aria-label="Your hand and actions">
      <div class="hand-label"><span>Your cards</span><span id="hand-note">Choose, then confirm</span></div>
      <div id="hand" class="hand" role="group" aria-label="Your cards"></div>
      <div class="action-panel">
        <h2 id="instruction" aria-live="polite" aria-atomic="true"></h2><p id="detail"></p>
        <div class="bid-controls"><div id="choices" class="choices" role="group" aria-label="Trump decision"></div>
        <button id="alone" class="alone-toggle" aria-pressed="false" aria-label="Go alone; partner sits out" hidden><span class="check" aria-hidden="true">✓</span>Go alone</button></div>
        <button id="primary-action" class="primary" disabled>Choose an action</button>
      </div>
    </section>
  </div>
  <p id="storage-note" class="storage-note" role="status"></p>
  <footer class="game-footer">A little time at the card table. <span>No ads. No account.</span></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-shell"><header class="panel-header"><h2 id="panel-title"></h2><button id="close-panel" class="quiet">Done</button></header><div id="panel-body" class="panel-body"></div></div></dialog>
<script src="/ai/games/cards/releases/905f8c95f726efb4/euchre/deck.js"></script><script src="/ai/games/cards/releases/905f8c95f726efb4/euchre/engine.js"></script><script src="/ai/games/cards/releases/905f8c95f726efb4/euchre/touch.js"></script><script src="/ai/games/cards/releases/905f8c95f726efb4/shared/progress.js"></script><script src="/ai/games/cards/releases/905f8c95f726efb4/shared/suite.js"></script>
<script src="/ai/games/cards/releases/905f8c95f726efb4/euchre/app.js"></script>
</body>
</html>
