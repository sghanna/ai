<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Effects Studio & Diagnostic - Antigravity Solitaire</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #175e35 0%, #0d3b20 50%, #051a0d 100%) !important;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 16px 80px 16px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-y: auto !important;
    }

    .container {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: rgba(14, 46, 28, 0.95);
      border: 1.5px solid #fbbf24;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(251, 191, 36, 0.15);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 26px;
      color: #fef08a;
      margin: 0 0 4px 0;
    }

    .sub {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 32, 20, 0.8);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #fef08a;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.suspended {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .status-dot.muted {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }

    .btn-sound {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(251, 191, 36, 0.35);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 160ms ease;
    }

    .btn-sound:hover {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
      color: #fef08a;
      transform: translateY(-1px);
    }

    .btn-sound:active {
      transform: scale(0.97);
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      border: 1.5px solid #fef08a;
      color: #1b0a0a;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="panel">
      <div>
        <h1>🔊 Sound Effects Diagnostic & Studio</h1>
        <p class="sub">Test each sound effect in real time to verify Web Audio API output</p>
      </div>

      <div class="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Audio Status: Checking...</span>
      </div>

      <div style="font-size: 14px; font-weight: 700; color: #fef08a; margin-top: 6px;">Tap any button to play sound:</div>

      <div class="btn-grid">
        <button class="btn-sound" onclick="testSound('playCardPlace')">🂡 Card Snap / Place</button>
        <button class="btn-sound" onclick="testSound('playCardFlip')">🂠 Card Flip Up</button>
        <button class="btn-sound" onclick="testSound('playStockDraw')">🂮 Stock Draw Slide</button>
        <button class="btn-sound" onclick="testSound('playCardSelect')">👆 Card Select Tick</button>
        <button class="btn-sound" onclick="testSound('playUndo')">↩️ Undo Swoosh</button>
        <button class="btn-sound" onclick="testSound('playInvalidMove')">⛔ Invalid Move</button>
        <button class="btn-sound" onclick="testFoundationSound()">🏛️ Foundation Chime</button>
        <button class="btn-sound" onclick="testSound('playAceCelebration')">✨ Ace Sparkling Chime</button>
        <button class="btn-sound" onclick="testSound('playVictory')">🏆 Victory Fanfare</button>
      </div>

      <div class="action-row">
        <button class="btn-secondary" onclick="forceUnmute()">🔊 Unmute & Reset Audio</button>
        <a href="/" class="btn-primary">Return to Game</a>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script>
    let foundationRank = 1;

    function updateStatus() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      if (!window.solitaireAudio) {
        dot.className = 'status-dot muted';
        text.textContent = 'Audio Engine: Not Initialized';
        return;
      }

      if (window.solitaireAudio.isMuted()) {
        dot.className = 'status-dot muted';
        text.textContent = 'Sound is MUTED (Click "Unmute & Reset Audio" below)';
      } else {
        const state = window.solitaireAudio.ctx ? window.solitaireAudio.ctx.state : 'uninitialized';
        if (state === 'running') {
          dot.className = 'status-dot';
          text.textContent = 'Audio Engine: ACTIVE & RUNNING (Sound is Working!)';
        } else if (state === 'suspended') {
          dot.className = 'status-dot suspended';
          text.textContent = 'Audio Engine: SUSPENDED (Tap any button to unlock)';
        } else {
          dot.className = 'status-dot';
          text.textContent = 'Audio Engine: READY (Tap any button to play)';
        }
      }
    }

    function testSound(fnName) {
      if (!window.solitaireAudio) return;
      if (window.solitaireAudio.isMuted()) {
        window.solitaireAudio.setMuted(false);
      }
      window.solitaireAudio.init();
      if (typeof window.solitaireAudio[fnName] === 'function') {
        window.solitaireAudio[fnName]();
      }
      updateStatus();
    }

    function testFoundationSound() {
      if (!window.solitaireAudio) return;
      if (window.solitaireAudio.isMuted()) {
        window.solitaireAudio.setMuted(false);
      }
      window.solitaireAudio.init();
      window.solitaireAudio.playFoundation(foundationRank);
      foundationRank = (foundationRank % 13) + 1;
      updateStatus();
    }

    function forceUnmute() {
      if (!window.solitaireAudio) return;
      window.solitaireAudio.setMuted(false);
      window.solitaireAudio.init();
      window.solitaireAudio.playCardPlace();
      updateStatus();
      alert('Sound unmuted! You should have heard a card snap.');
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateStatus();
    });
  </script>
</body>
</html>
