<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="opt5_lantern" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="opt5_felt" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#143e2c"/>
      <stop offset="100%" stop-color="#06160f"/>
    </radialGradient>
  </defs>
  <!-- Dark Pine Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#opt5_felt)" stroke="#b09748" stroke-width="2"/>
  
  <!-- Top Hanger Ring -->
  <circle cx="32" cy="8.5" r="3" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- Lantern Gold Cap -->
  <rect x="23" y="11" width="18" height="4" rx="1.5" fill="#fbbf24"/>
  
  <!-- Glowing Lantern Oval Body -->
  <ellipse cx="32" cy="31" rx="19" ry="17" fill="url(#opt5_lantern)" stroke="#fbbf24" stroke-width="1.5" filter="drop-shadow(0 0 8px rgba(239, 68, 68, 0.7))"/>
  
  <!-- Lantern Ribs -->
  <ellipse cx="32" cy="31" rx="11" ry="17" fill="none" stroke="rgba(254, 240, 138, 0.45)" stroke-width="1"/>
  <line x1="32" y1="14" x2="32" y2="48" stroke="rgba(254, 240, 138, 0.55)" stroke-width="1"/>
  
  <!-- Gold Double Happiness (囍) Inscription -->
  <text x="32" y="38" font-family="'PingFang SC', sans-serif" font-size="18" font-weight="900" fill="#fef08a" text-anchor="middle" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">囍</text>
  
  <!-- Lantern Gold Bottom Base -->
  <rect x="25" y="47" width="14" height="3" rx="1.2" fill="#fbbf24"/>
  <!-- Hanging Silk Tassel -->
  <path d="M 30,50 L 30,59 M 32,50 L 32,61 M 34,50 L 34,59" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
</svg>